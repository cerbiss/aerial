<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagamento annullato — Aerial</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{--studio:#EEF0F3;--paper:#fff;--ink:#14171D;--graphite:#5D6470;--line-2:#E6E9EE;--blue:#1E63FF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--studio);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;line-height:1.55}
.card{width:min(520px,100%);background:var(--paper);border-radius:22px;padding:32px;box-shadow:0 24px 48px -24px rgba(20,23,29,.2),0 0 0 1px var(--line-2)}
h1{margin:0 0 10px;font-size:1.9rem;line-height:1.1;letter-spacing:-.03em;font-variation-settings:"wdth" 120}
p{margin:0 0 20px;color:var(--graphite)}
a.btn{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <h1 id="t">Pagamento annullato</h1>
  <p id="m">Non ti è stato addebitato nulla. Il tuo preventivo è ancora salvato: puoi riprovare quando vuoi.</p>
  <a class="btn" href="/#price">Torna al preventivo</a>
</main>
<script>
  if (new URLSearchParams(location.search).has('errore')) {
    document.getElementById('t').textContent = 'Il pagamento non è andato a buon fine';
    document.getElementById('m').textContent = 'Non ti è stato addebitato nulla. Riprova, oppure scegli l’altro metodo di pagamento.';
  }
</script>
</body>
</html>
